<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./src/assets/images/Code.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5BRC3Q281B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-5BRC3Q281B');
  </script>
  <title>rajpakhurde.dev</title>

  <!-- Google Fonts: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    // Inline Theme Detection to prevent theme flashing during load screen
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <style>
    /* CSS Variables for Loader Themes (Synchronized with portfolio style guidelines) */
    :root {
      --bg-loader: #fafafa;
      --bg-tab-active: #ffffff;
      --border-color: #e2e8f0;
      --color-text: #0f172a;
      --color-tag: #cf222e;        /* Warm red/orange for tags */
      --color-name: #0550ae;       /* Deep blue for name */
      --color-prompt: #57606a;     /* Muted gray for prompt */
      --color-bar-fill: #0052ff;   /* Accent blue */
      --color-bar-empty: #cbd5e1;
      --color-tab-close: #64748b;
      --shadow-tab: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    html.dark {
      --bg-loader: #020203;
      --bg-tab-active: #0a0a0c;
      --border-color: rgba(255, 255, 255, 0.06);
      --color-text: #ededef;
      --color-tag: #ff7b72;
      --color-name: #79c0ff;
      --color-prompt: #8a8f98;
      --color-bar-fill: #5e6ad2;
      --color-bar-empty: rgba(255, 255, 255, 0.08);
      --color-tab-close: #8a8f98;
      --shadow-tab: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    #loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-loader);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: 'JetBrains Mono', monospace;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .editor-tab {
      background-color: var(--bg-tab-active);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-tab);
      user-select: none;
    }

    .tab-file-icon {
      color: var(--color-tag);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-title-logo {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .tag-symbol {
      color: var(--color-tag);
      font-weight: 700;
    }

    .name-symbol {
      color: var(--color-name);
      font-weight: 700;
      margin: 0 0.25rem;
    }

    .tab-close-icon {
      color: var(--color-tab-close);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-close-icon:hover {
      background-color: rgba(120, 120, 120, 0.12);
      color: var(--color-tag);
    }

    .terminal-status-container {
      width: 100%;
      max-width: 480px;
      padding: 0 1.5rem;
    }

    .terminal-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5rem;
      color: var(--color-text);
    }

    .prompt-symbol {
      color: var(--color-prompt);
      font-weight: bold;
    }

    .status-message {
      display: inline-block;
      min-width: 180px;
    }

    .progress-bar-text {
      color: var(--color-bar-fill);
      letter-spacing: 0.05em;
      user-select: none;
    }

    .percent-number {
      font-weight: bold;
      color: var(--color-name);
      min-width: 40px;
      text-align: right;
    }

    @media (prefers-reduced-motion: reduce) {
      #loader-container {
        transition: opacity 0.15s ease-out !important;
        transform: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Custom Compiler Loading Screen -->
  <div id="loader-container">
    <div class="editor-tab">
      <div class="tab-file-icon">
        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div class="tab-title-logo">
        <span class="tag-symbol">&lt;</span><span class="name-symbol">Raj Pakhurde</span><span class="tag-symbol">/&gt;</span>
      </div>
      <div id="loader-close-btn" class="tab-close-icon" title="Skip loading">
        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>
    <div class="terminal-status-container">
      <div class="terminal-line">
        <span class="prompt-symbol">$</span>
        <span id="status-msg" class="status-message">resolving assets...</span>
        <span id="progress-blocks" class="progress-bar-text">░░░░░░░░░░</span>
        <span id="progress-percent" class="percent-number">0%</span>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- LOADER RUNTIME LOGIC -->
  <script>
    (function() {
      let progress = 0;
      let pageLoaded = false;
      let loaderInterval = null;
      
      const container = document.getElementById('loader-container');
      const statusMsg = document.getElementById('status-msg');
      const progressBlocks = document.getElementById('progress-blocks');
      const progressPercent = document.getElementById('progress-percent');
      const closeBtn = document.getElementById('loader-close-btn');

      const barWidth = 10;
      const fillChar = '▓';
      const emptyChar = '░';

      const stages = [
        { maxPercent: 30, text: 'resolving assets...' },
        { maxPercent: 65, text: 'optimizing images...' },
        { maxPercent: 100, text: 'building portfolio...' }
      ];

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Event listener for window load
      window.addEventListener('load', function() {
        pageLoaded = true;
      });

      function updateUI(pct) {
        if (!progressPercent) return;
        progressPercent.textContent = pct + '%';
        
        const filledCount = Math.round((pct / 100) * barWidth);
        const emptyCount = barWidth - filledCount;
        
        progressBlocks.innerHTML = fillChar.repeat(filledCount) + '<span style="color: var(--color-bar-empty);">' + emptyChar.repeat(emptyCount) + '</span>';

        const stage = stages.find(s => pct <= s.maxPercent) || stages[stages.length - 1];
        if (statusMsg.textContent !== stage.text) {
          statusMsg.textContent = stage.text;
        }
      }

      function fadeOut() {
        if (!container) return;
        container.style.opacity = '0';
        container.style.transform = 'scale(0.97)';
        setTimeout(function() {
          container.style.display = 'none';
          container.remove(); // Clean up from DOM to free resources
        }, 600);
      }

      // Skip Loading Screen Easter Egg
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          pageLoaded = true;
          clearInterval(loaderInterval);
          updateUI(100);
          fadeOut();
        });
      }

      // Check reduced motion preference
      if (prefersReducedMotion) {
        updateUI(100);
        setTimeout(fadeOut, 200);
        return;
      }

      // Start animation loop
      loaderInterval = setInterval(function() {
        let increment = Math.floor(Math.random() * 8) + 2;
        progress += increment;

        if (progress >= 99) {
          if (!pageLoaded) {
            progress = 99; // Hang at 99% until real load event triggers
          } else {
            progress = 100;
          }
        }

        updateUI(progress);

        if (progress >= 100) {
          clearInterval(loaderInterval);
          fadeOut();
        }
      }, 75);
    })();
  </script>
</body>

</html>
