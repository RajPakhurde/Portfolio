<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loader Preview</title>
  <!-- Google Fonts: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables for Light and Dark Editor Themes */
    :root {
      /* Light Mode Variables (GitHub Light Editor style) */
      --bg-loader: #f6f8fa;
      --bg-tab-active: #ffffff;
      --bg-tab-inactive: #eaeef2;
      --border-color: #d0d7de;
      
      --color-text: #24292f;
      --color-tag: #cf222e;        /* Warm red/orange for < and /> */
      --color-name: #0550ae;       /* Deep blue for Raj Pakhurde */
      --color-prompt: #57606a;     /* Terminal prompt $ */
      
      --color-bar-fill: #1a7f37;   /* Green for filled progress */
      --color-bar-empty: #d0d7de;  /* Light gray for empty progress */
      --color-tab-close: #57606a;
      
      --shadow-tab: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Activated via localstorage / system preference detection script below */
    html.dark {
      /* Dark Mode Variables (GitHub Dark Editor / VS Code Dark+ style) */
      --bg-loader: #0b0e14;
      --bg-tab-active: #0d1117;
      --bg-tab-inactive: #07090e;
      --border-color: #21262d;
      
      --color-text: #c9d1d9;
      --color-tag: #ff7b72;        /* Warm red/orange */
      --color-name: #79c0ff;       /* Light blue */
      --color-prompt: #8b949e;     /* Terminal prompt $ */
      
      --color-bar-fill: #56d364;   /* Light green */
      --color-bar-empty: #30363d;  /* Dark gray */
      --color-tab-close: #8b949e;
      
      --shadow-tab: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-loader);
      color: var(--color-text);
      font-family: 'JetBrains Mono', monospace;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* MAIN LOADER CONTAINER */
    #loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-loader);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* CODE EDITOR TAB ELEMENT */
    .editor-tab {
      background-color: var(--bg-tab-active);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-tab);
      user-select: none;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .tab-file-icon {
      color: var(--color-tag);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-title-logo {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .tag-symbol {
      color: var(--color-tag);
      font-weight: 700;
    }

    .name-symbol {
      color: var(--color-name);
      font-weight: 700;
      margin: 0 0.25rem;
    }

    .tab-close-icon {
      color: var(--color-tab-close);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-close-icon:hover {
      background-color: rgba(120, 120, 120, 0.15);
      color: var(--color-tag);
    }

    /* TERMINAL STATUS BLOCK */
    .terminal-status-container {
      width: 100%;
      max-width: 480px;
      padding: 0 1.5rem;
    }

    .terminal-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5rem;
    }

    .prompt-symbol {
      color: var(--color-prompt);
      font-weight: bold;
    }

    .status-message {
      color: var(--color-text);
      display: inline-block;
      min-width: 180px;
    }

    .progress-bar-text {
      color: var(--color-bar-fill);
      letter-spacing: 0.05em;
      user-select: none;
    }

    .progress-bar-text span.empty {
      color: var(--color-bar-empty);
    }

    .percent-number {
      font-weight: bold;
      color: var(--color-name);
      min-width: 40px;
      text-align: right;
    }

    /* DEMO RESET BUTTON (only visible when viewing preview directly) */
    .demo-controls {
      position: absolute;
      bottom: 2rem;
      display: flex;
      gap: 1rem;
      z-index: 10000;
    }

    .demo-btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-tab-active);
      color: var(--color-text);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: var(--shadow-tab);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .demo-btn:hover {
      background-color: var(--bg-tab-inactive);
      border-color: var(--color-name);
    }

    /* REDUCED MOTION PREFERENCE */
    @media (prefers-reduced-motion: reduce) {
      #loader-container {
        transition: opacity 0.15s ease-out !important;
        transform: none !important;
      }
      .progress-bar-text, .percent-number {
        transition: none !important;
      }
    }
  </style>

  <script>
    // Inline Theme Detection to prevent flash of wrong theme
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body>

  <!-- LOADER WRAPPER -->
  <div id="loader-container">
    <!-- Editor Tab Logo -->
    <div class="editor-tab">
      <div class="tab-file-icon">
        <!-- SVG Code Tag Icon -->
        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div class="tab-title-logo">
        <span class="tag-symbol">&lt;</span><span class="name-symbol">Raj Pakhurde</span><span class="tag-symbol">/&gt;</span>
      </div>
      <div class="tab-close-icon" onclick="resetLoader()" title="Reset Demo Loader">
        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>

    <!-- Terminal Progress line -->
    <div class="terminal-status-container">
      <div class="terminal-line">
        <span class="prompt-symbol">$</span>
        <span id="status-msg" class="status-message">resolving assets...</span>
        <span id="progress-blocks" class="progress-bar-text">░░░░░░░░░░</span>
        <span id="progress-percent" class="percent-number">0%</span>
      </div>
    </div>
  </div>

  <!-- DEMO SITE PLACEHOLDER (To see what is revealed) -->
  <div style="text-align: center; max-width: 600px; padding: 2rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; font-weight: 700;">Portfolio Loaded!</h1>
    <p style="color: var(--color-prompt); margin-bottom: 2rem;">The custom compiler-style loading screen completed successfully and faded out. This is your portfolio's main layout.</p>
    <a href="#" onclick="toggleDemoTheme()" style="color: var(--color-name); font-weight: bold; text-decoration: none; border-bottom: 2px solid currentColor; padding-bottom: 2px;">Toggle Light/Dark Theme</a>
  </div>

  <!-- DEMO UTILITIES BUTTONS -->
  <div class="demo-controls">
    <button class="demo-btn" onclick="resetLoader()">Replay Loader</button>
    <button class="demo-btn" onclick="toggleDemoTheme()">Toggle Theme</button>
  </div>

  <!-- LOADER LOGIC SCRIPT -->
  <script>
    let progress = 0;
    let pageLoaded = false;
    let loaderInterval = null;
    const loaderContainer = document.getElementById('loader-container');
    const statusMsg = document.getElementById('status-msg');
    const progressBlocks = document.getElementById('progress-blocks');
    const progressPercent = document.getElementById('progress-percent');

    // Total character width of progress bar
    const barWidth = 10; 
    const fillChar = '▓';
    const emptyChar = '░';

    // Status message stages
    const stages = [
      { maxPercent: 30, text: 'resolving assets...' },
      { maxPercent: 65, text: 'optimizing images...' },
      { maxPercent: 100, text: 'building portfolio...' }
    ];

    // Check if user prefers reduced motion
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Listen to real window load event
    window.addEventListener('load', () => {
      pageLoaded = true;
    });

    function updateProgressUI(pct) {
      progressPercent.textContent = `${pct}%`;
      
      // Calculate filled blocks vs empty blocks
      const filledCount = Math.round((pct / 100) * barWidth);
      const emptyCount = barWidth - filledCount;
      
      progressBlocks.innerHTML = `${fillChar.repeat(filledCount)}<span class="empty">${emptyChar.repeat(emptyCount)}</span>`;

      // Update status text based on percentage stage
      const stage = stages.find(s => pct <= s.maxPercent) || stages[stages.length - 1];
      if (statusMsg.textContent !== stage.text) {
        statusMsg.textContent = stage.text;
      }
    }

    function runLoader() {
      // Clear previous interval if any
      if (loaderInterval) clearInterval(loaderInterval);
      
      // Reset variables
      progress = 0;
      loaderContainer.style.display = 'flex';
      loaderContainer.style.opacity = '1';
      loaderContainer.style.transform = 'scale(1)';
      updateProgressUI(0);

      // Respect prefers-reduced-motion: skip animation
      if (prefersReducedMotion) {
        updateProgressUI(100);
        setTimeout(fadeLoaderOut, 300);
        return;
      }

      // Interval to update progress
      loaderInterval = setInterval(() => {
        // Natural random incrementing step
        let increment = Math.floor(Math.random() * 8) + 2; 
        progress += increment;

        // Caps progress at 99% if the page hasn't fully loaded yet
        if (progress >= 99) {
          if (!pageLoaded) {
            progress = 99; // Hang at 99% until real load event fires
          } else {
            progress = 100;
          }
        }

        updateProgressUI(progress);

        if (progress >= 100) {
          clearInterval(loaderInterval);
          fadeLoaderOut();
        }
      }, 80); // Fast interval for a natural fluid animation of ~1.5 - 2s
    }

    function fadeLoaderOut() {
      // 600ms fade and scale transition
      loaderContainer.style.opacity = '0';
      loaderContainer.style.transform = 'scale(0.97)';
      
      setTimeout(() => {
        loaderContainer.style.display = 'none';
      }, 600);
    }

    // Helper functions for the demo view
    function resetLoader() {
      // Simulate that page is loading again for the replay
      pageLoaded = false;
      
      // Auto-trigger page loaded after a short delay for demonstration
      setTimeout(() => {
        pageLoaded = true;
      }, 1800);

      runLoader();
    }

    function toggleDemoTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Start loader on initial load
    resetLoader();
  </script>
</body>
</html>
